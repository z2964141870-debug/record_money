name: Build and Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional completed build run ID to publish without rebuilding'
        required: false
        type: string
      release_tag:
        description: 'Existing version tag (required when reusing a build run)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: inputs.source_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: script/package-lock.json
      - run: npm ci && npm test && npm run build && npm run release
        working-directory: script
      - run: cp script/compose.yaml data/releases/compose.yaml
      - run: cp reports/FEISHU.md reports/DINGTALK.md data/releases/
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: data/releases/*
  mac:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: script/package-lock.json
      - run: npm ci && npm run build && npm run package:mac
        working-directory: script
      - name: Verify bundled fixed-mode runtime
        working-directory: script
        run: |
          ditto -x -k "../data/releases/record-money-v$(node -p 'require("./package.json").version')-macos-$(node -p 'process.arch').zip" "$RUNNER_TEMP/record-money-unpacked"
          "$RUNNER_TEMP/record-money-unpacked/私人记账助手.app/Contents/MacOS/RecordMoney" --install-only --destination "$RUNNER_TEMP/record-money-installed"
          VERSION=$(node -p 'require("./package.json").version')
          npx tsx tools/runtime-smoke.ts --home "$RUNNER_TEMP/record-money-ledger" --node "$RUNNER_TEMP/record-money-installed/desktop/$VERSION/bin/node" --server "$RUNNER_TEMP/record-money-installed/desktop/$VERSION/script/build/start.js"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: data/releases/*
  docker:
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(node -p 'require("./script/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: script/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
  windows:
    needs: source
    uses: ./.github/workflows/windows.yml
  publish:
    if: >-
      always() &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.source.result == 'success' && needs.mac.result == 'success' && needs.docker.result == 'success' && needs.windows.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' && inputs.release_tag != ''))
    needs: [source, mac, docker, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN: ${{ inputs.source_run_id }}
          TARGET_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing vMAJOR.MINOR.PATCH tag'
            exit 1
          fi
          if [ -n "$BUILD_RUN" ]; then
            if ! [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]; then exit 1; fi
            BUILD_REF=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_branch)
            if [ "$BUILD_REF" != "$TARGET_TAG" ]; then
              echo 'Build run must belong to the requested version tag'
              exit 1
            fi
          fi
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '{source,mac-*,windows}'
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "私人记账助手 $RELEASE_TAG" --notes-file reports/RELEASE.md
